<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PRANK MODE</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px),
        #080808;

      background-size: 25px 25px;

      color: white;
      font-family: 'Press Start 2P', monospace;

      display: flex;
      justify-content: center;
      align-items: center;

      position: relative;
    }

    /* ---------------------------
       FLASHING SCREEN
    ---------------------------- */

    body.flashing::before {
      content: "";
      position: fixed;
      inset: 0;

      background: rgba(255,255,255,.85);

      pointer-events: none;

      z-index: 50;

      animation: flash 0.22s infinite alternate;
    }

    @keyframes flash {
      from {
        opacity: 0;
      }

      to {
        opacity: .55;
      }
    }

    /* ---------------------------
       MAIN CONTAINER
    ---------------------------- */

    .container {
      width: min(92vw, 650px);
      text-align: center;
      position: relative;
      z-index: 5;
    }

    .top-text {
      font-size: clamp(10px, 2vw, 14px);
      margin-bottom: 25px;
      color: #bdbdbd;
      letter-spacing: 2px;
    }

    .title {
      font-size: clamp(22px, 6vw, 46px);
      margin-bottom: 35px;

      color: #fff;

      text-shadow:
        4px 4px 0 #333,
        0 0 20px rgba(255,255,255,.25);
    }

    /* ---------------------------
       3D PANEL
    ---------------------------- */

    .game-wrapper {
      position: relative;
      width: min(90vw, 520px);
      margin: auto;

      perspective: 1000px;
    }

    .game-panel {
      position: relative;

      width: 100%;
      aspect-ratio: 16 / 10;

      background: #111;

      border: 7px solid #e8e8e8;

      box-shadow:
        0 0 0 7px #333,
        0 18px 0 #222,
        0 25px 35px rgba(0,0,0,.8);

      transform: rotateX(3deg);

      overflow: hidden;
    }

    /* Dino-game style ground */

    .ground {
      position: absolute;
      left: 5%;
      right: 5%;
      bottom: 24%;

      height: 4px;

      background: #eee;

      box-shadow:
        0 0 0 1px #111;
    }

    .ground::before,
    .ground::after {
      content: "";

      position: absolute;
      top: 8px;

      width: 35px;
      height: 3px;

      background: #888;
    }

    .ground::before {
      left: 15%;
    }

    .ground::after {
      right: 25%;
    }

    /* Dino-like pixel character */

    .pixel-character {
      position: absolute;

      left: 18%;
      bottom: 24%;

      width: 45px;
      height: 45px;

      background: #eee;

      clip-path: polygon(
        0 25%,
        45% 25%,
        45% 0,
        75% 0,
        75% 18%,
        100% 18%,
        100% 60%,
        75% 60%,
        75% 100%,
        58% 100%,
        58% 75%,
        35% 75%,
        35% 100%,
        18% 100%,
        18% 68%,
        0 68%
      );

      animation: dino 0.5s steps(2) infinite;
    }

    @keyframes dino {
      0% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-2px);
      }

      100% {
        transform: translateY(0);
      }
    }

    /* Cactus */

    .cactus {
      position: absolute;

      right: 20%;
      bottom: 24%;

      width: 15px;
      height: 55px;

      background: #eee;
    }

    .cactus::before {
      content: "";

      position: absolute;

      left: -14px;
      top: 18px;

      width: 20px;
      height: 12px;

      background: #eee;
    }

    .cactus::after {
      content: "";

      position: absolute;

      right: -14px;
      top: 8px;

      width: 20px;
      height: 12px;

      background: #eee;
    }

    /* ---------------------------
       WARNING TEXT
    ---------------------------- */

    .warning {
      margin-top: 30px;

      font-size: clamp(8px, 2vw, 11px);

      color: #999;

      line-height: 1.8;
    }

    /* ---------------------------
       UNIQUE 3D BUTTON
    ---------------------------- */

    .start-btn {
      position: relative;

      margin-top: 25px;

      padding: 20px 45px;

      border: none;

      color: #111;

      background: #fff;

      font-family: 'Press Start 2P', monospace;

      font-size: 12px;

      cursor: pointer;

      transform: skew(-12deg);

      box-shadow:
        8px 8px 0 #777,
        14px 14px 0 #222;

      transition:
        transform .12s,
        box-shadow .12s;
    }

    .start-btn span {
      display: block;
      transform: skew(12deg);
    }

    .start-btn:hover {
      transform: skew(-12deg) translate(-3px, -3px);

      box-shadow:
        11px 11px 0 #777,
        17px 17px 0 #222;
    }

    .start-btn:active {
      transform: skew(-12deg) translate(8px, 8px);

      box-shadow:
        2px 2px 0 #777,
        5px 5px 0 #222;
    }

    /* ---------------------------
       FOOTER
    ---------------------------- */

    .footer {
      position: fixed;

      bottom: 18px;
      left: 0;
      right: 0;

      text-align: center;

      font-size: 8px;

      color: #666;

      z-index: 10;
    }

    .footer a {
      color: #aaa;
      text-decoration: none;
    }

    .footer a:hover {
      color: white;
    }

    /* ---------------------------
       ACTIVE PRANK STATE
    ---------------------------- */

    body.prank-active .title {
      animation: shake .08s infinite;
    }

    body.prank-active .game-panel {
      animation: panelShake .12s infinite;
    }

    @keyframes shake {
      0% {
        transform: translateX(-2px);
      }

      50% {
        transform: translateX(2px);
      }

      100% {
        transform: translateX(-2px);
      }
    }

    @keyframes panelShake {
      0% {
        transform: rotateX(3deg) translate(0,0);
      }

      25% {
        transform: rotateX(3deg) translate(2px,-1px);
      }

      50% {
        transform: rotateX(3deg) translate(-2px,1px);
      }

      75% {
        transform: rotateX(3deg) translate(1px,2px);
      }

      100% {
        transform: rotateX(3deg) translate(0,0);
      }
    }

    /* ---------------------------
       MOBILE
    ---------------------------- */

    @media (max-width: 500px) {

      .title {
        margin-bottom: 25px;
      }

      .game-panel {
        border-width: 5px;
      }

      .start-btn {
        padding: 17px 30px;
        font-size: 10px;
      }

      .footer {
        font-size: 7px;
      }
    }

  </style>
</head>

<body>

  <main class="container">

    <div class="top-text">
      SYSTEM READY // 404
    </div>

    <h1 class="title">
      PRANK MODE
    </h1>

    <div class="game-wrapper">

      <div class="game-panel">

        <div class="pixel-character"></div>

        <div class="cactus"></div>

        <div class="ground"></div>

      </div>

    </div>

    <p class="warning">
      WARNING: DO NOT PRESS THE BUTTON
    </p>

    <button class="start-btn" id="startButton">
      <span>START PRANK</span>
    </button>

  </main>


  <!--
    IMPORTANT:
    selfie.mp3 ko isi HTML file ke folder mein rakho.
  -->

  <audio id="prankAudio" src="selfie.mp3" preload="auto"></audio>


  <footer class="footer">

    CREATED BY
    <a
      href="https://www.instagram.com/be.like_sahil?igsi=MTF3eWhrZ3o1NWdzeQ=="
      target="_blank"
      rel="noopener noreferrer"
    >
      @BE.LIKE_SAHIL
    </a>

    &nbsp; • &nbsp;

    FOLLOW FOR MORE PRANK WEBSITES

  </footer>


  <script>

    const button = document.getElementById("startButton");
    const audio = document.getElementById("prankAudio");

    let prankStarted = false;

    button.addEventListener("click", async () => {

      if (prankStarted) return;

      prankStarted = true;

      document.body.classList.add("prank-active");
      document.body.classList.add("flashing");

      /*
        Browser autoplay restriction ko bypass karne ke liye
        audio user ke button click ke andar start kiya ja raha hai.
      */

      audio.loop = true;
      audio.currentTime = 0;

      try {

        await audio.play();

      } catch (error) {

        console.log("Audio could not start:", error);

      }

      button.innerHTML = "<span>PRANK ACTIVATED</span>";

    });

  </script>

</body>
</html>
