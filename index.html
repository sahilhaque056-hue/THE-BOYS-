<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PRANK MODE</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
        #080808;

      background-size: 25px 25px;

      color: #fff;
      font-family: 'Press Start 2P', monospace;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;
    }


    /* =========================
       FLASH EFFECT
    ========================= */

    body.flashing::before {
      content: "";

      position: fixed;
      inset: 0;

      background: #fff;

      opacity: 0;

      pointer-events: none;

      z-index: 100;

      animation: screenFlash .18s infinite alternate;
    }

    @keyframes screenFlash {
      from {
        opacity: 0;
      }

      to {
        opacity: .48;
      }
    }


    /* =========================
       MAIN
    ========================= */

    .container {
      width: min(92vw, 650px);

      text-align: center;

      position: relative;

      z-index: 5;
    }


    .top-text {
      color: #777;

      font-size: clamp(8px, 2vw, 12px);

      letter-spacing: 2px;

      margin-bottom: 24px;
    }


    .title {
      font-size: clamp(24px, 6vw, 48px);

      color: #fff;

      margin-bottom: 35px;

      text-shadow:
        4px 4px 0 #333,
        0 0 25px rgba(255,255,255,.15);
    }


    /* =========================
       3D GAME PANEL
    ========================= */

    .game-wrapper {
      width: min(90vw, 520px);

      margin: auto;

      perspective: 1000px;
    }


    .game-panel {
      width: 100%;

      aspect-ratio: 16 / 10;

      position: relative;

      overflow: hidden;

      background: #111;

      border: 7px solid #eee;

      box-shadow:
        0 0 0 7px #333,
        0 18px 0 #222,
        0 28px 40px rgba(0,0,0,.8);

      transform: rotateX(4deg);
    }


    /* =========================
       PIXEL DINO
    ========================= */

    .pixel-character {
      position: absolute;

      left: 17%;
      bottom: 24%;

      width: 46px;
      height: 46px;

      background: #eee;

      clip-path: polygon(
        0 25%,
        45% 25%,
        45% 0,
        75% 0,
        75% 18%,
        100% 18%,
        100% 60%,
        75% 60%,
        75% 100%,
        58% 100%,
        58% 75%,
        35% 75%,
        35% 100%,
        18% 100%,
        18% 68%,
        0 68%
      );

      animation: dinoBounce .5s steps(2) infinite;
    }

    @keyframes dinoBounce {
      0% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-2px);
      }

      100% {
        transform: translateY(0);
      }
    }


    /* =========================
       CACTUS
    ========================= */

    .cactus {
      position: absolute;

      right: 20%;
      bottom: 24%;

      width: 15px;
      height: 55px;

      background: #eee;
    }

    .cactus::before {
      content: "";

      position: absolute;

      left: -14px;
      top: 18px;

      width: 20px;
      height: 12px;

      background: #eee;
    }

    .cactus::after {
      content: "";

      position: absolute;

      right: -14px;
      top: 8px;

      width: 20px;
      height: 12px;

      background: #eee;
    }


    /* =========================
       GROUND
    ========================= */

    .ground {
      position: absolute;

      left: 5%;
      right: 5%;
      bottom: 24%;

      height: 4px;

      background: #eee;
    }

    .ground::before,
    .ground::after {
      content: "";

      position: absolute;

      top: 8px;

      height: 3px;

      background: #777;
    }

    .ground::before {
      width: 35px;
      left: 15%;
    }

    .ground::after {
      width: 45px;
      right: 25%;
    }


    /* =========================
       WARNING
    ========================= */

    .warning {
      margin-top: 30px;

      color: #888;

      font-size: clamp(8px, 2vw, 11px);

      line-height: 1.8;
    }


    /* =========================
       3D BUTTON
    ========================= */

    .start-btn {
      position: relative;

      margin-top: 25px;

      padding: 20px 45px;

      border: 0;

      background: #fff;

      color: #111;

      font-family: 'Press Start 2P', monospace;

      font-size: 12px;

      cursor: pointer;

      transform: skew(-12deg);

      box-shadow:
        8px 8px 0 #777,
        14px 14px 0 #222;

      transition:
        transform .12s,
        box-shadow .12s;
    }

    .start-btn span {
      display: block;

      transform: skew(12deg);
    }

    .start-btn:hover {
      transform: skew(-12deg) translate(-3px, -3px);

      box-shadow:
        11px 11px 0 #777,
        17px 17px 0 #222;
    }

    .start-btn:active {
      transform: skew(-12deg) translate(8px, 8px);

      box-shadow:
        2px 2px 0 #777,
        5px 5px 0 #222;
    }


    /* =========================
       PRANK ACTIVE
    ========================= */

    body.prank-active .title {
      animation: titleShake .08s infinite;
    }

    body.prank-active .game-panel {
      animation: panelShake .12s infinite;
    }

    @keyframes titleShake {
      0% {
        transform: translateX(-2px);
      }

      50% {
        transform: translateX(2px);
      }

      100% {
        transform: translateX(-2px);
      }
    }

    @keyframes panelShake {
      0% {
        transform: rotateX(4deg) translate(0,0);
      }

      25% {
        transform: rotateX(4deg) translate(2px,-1px);
      }

      50% {
        transform: rotateX(4deg) translate(-2px,1px);
      }

      75% {
        transform: rotateX(4deg) translate(1px,2px);
      }

      100% {
        transform: rotateX(4deg) translate(0,0);
      }
    }


    /* =========================
       FOOTER
    ========================= */

    .footer {
      position: fixed;

      bottom: 18px;
      left: 0;
      right: 0;

      text-align: center;

      color: #555;

      font-size: 8px;

      z-index: 10;
    }

    .footer a {
      color: #888;

      text-decoration: none;
    }

    .footer a:hover {
      color: #fff;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 500px) {

      .game-panel {
        border-width: 5px;
      }

      .start-btn {
        padding: 17px 30px;

        font-size: 10px;
      }

      .footer {
        font-size: 7px;
      }
    }

  </style>
</head>


<body>


  <!-- =========================
       MAIN CONTENT
  ========================= -->

  <main class="container">

    <div class="top-text">
      SYSTEM READY // 404
    </div>


    <h1 class="title">
      PRANK MODE
    </h1>


    <div class="game-wrapper">

      <div class="game-panel">

        <div class="pixel-character"></div>

        <div class="cactus"></div>

        <div class="ground"></div>

      </div>

    </div>


    <p class="warning">
      WARNING: DO NOT PRESS THE BUTTON
    </p>


    <button
      class="start-btn"
      id="startButton"
      type="button"
    >
      <span>START PRANK</span>
    </button>

  </main>


  <!-- =========================
       AUDIO
  ========================= -->

  <audio
    id="prankAudio"
    src="selfie.mp3"
    preload="auto"
  ></audio>


  <!-- =========================
       FOOTER
  ========================= -->

  <footer class="footer">

    CREATED BY

    <a
      href="https://www.instagram.com/be.like_sahil?igsi=MTF3eWhrZ3o1NWdzeQ=="
      target="_blank"
      rel="noopener noreferrer"
    >
      @BE.LIKE_SAHIL
    </a>

    &nbsp; • &nbsp;

    FOLLOW FOR MORE PRANK WEBSITES

  </footer>


  <script>

    /* =========================
       VARIABLES
    ========================= */

    const button = document.getElementById("startButton");

    const audio = document.getElementById("prankAudio");

    let prankStarted = false;


    /* =========================
       HISTORY PROTECTION
    ========================= */

    /*
      Ek history entry add kar rahe hain.
      Browser Back press hone par popstate fire hoga.
    */

    history.pushState(
      {
        prankPage: true
      },
      "",
      location.href
    );


    /* =========================
       START PRANK
    ========================= */

    button.addEventListener("click", async () => {

      if (prankStarted) {
        return;
      }


      prankStarted = true;


      document.body.classList.add("prank-active");

      document.body.classList.add("flashing");


      /* Audio loop */

      audio.loop = true;

      audio.currentTime = 0;


      try {

        await audio.play();

      } catch (error) {

        console.log(
          "Audio blocked by browser:",
          error
        );

      }


      button.innerHTML =
        "<span>PRANK ACTIVATED</span>";

    });


    /* =========================
       BACK BUTTON
    ========================= */

    window.addEventListener(
      "popstate",
      async () => {

        /*
          Back press hone par same page ko
          history mein dobara push karte hain.
        */

        history.pushState(
          {
            prankPage: true
          },
          "",
          location.href
        );


        /*
          Agar prank already start ho chuka hai
          to effects ko active rakho.
        */

        if (prankStarted) {

          document.body.classList.add(
            "prank-active"
          );

          document.body.classList.add(
            "flashing"
          );


          /*
            Browser audio ko dobara play karne
            ki request.
          */

          try {

            await audio.play();

          } catch (error) {

            console.log(
              "Browser requires user interaction:",
              error
            );

          }

        }

      }
    );

  </script>

</body>
</html>
